name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Same packages as README.md "Requirements".
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm binutils binutils-m68k-linux-gnu \
            grub2-common grub-pc-bin xorriso mtools \
            qemu-system-x86

      - name: Boundary, host and QEMU self tests
        run: make test

      - name: Build the bootable ISO
        run: make iso
