# Menu of the USB test image (make usb-image; docs/p520.md). Works for BIOS/CSM and UEFI boot.
set default=0
set timeout=15

if [ "$grub_platform" = efi ]; then
    # The firmware's graphics output; the kernel keeps the mode the firmware chose.
    insmod efi_gop
fi

# UEFI: the graphics kernel to load. kernel-gfx1440.elf's Multiboot2 header asks for 2560x1440 (the
# native resolution of the P520's monitor, docs/p520.md): GRUB sets that mode if the firmware's graphics
# output has it and keeps the firmware's mode if not. kernel-gfx1080.elf asks for 1920x1080 (a menu entry
# below); kernel-gfx.elf asks for no size (the last menu entry): the firmware's own mode, e.g. 800x600.
# GRUB ignores gfxpayload for Multiboot2: only the kernel's header counts.
set efi_kernel=kernel-gfx1440.elf

# load_kernel <graphics 0|1|2> <kernel command line words...>
# BIOS: Multiboot 1 (text mode kernel.elf; kernel-gfx.elf asking for 640x480; 2 = kernel-gfx1440.elf asking
# for 2560x1440, which GRUB sets through the video BIOS's VBE if it has it, else a mode it has).
# UEFI: Multiboot2 and always the graphics kernel (there is no text mode).
function load_kernel {
    if [ "$grub_platform" = efi ]; then
        multiboot2 /boot/$efi_kernel $2 $3
        module2 /boot/initrd.tar initrd
        if [ -f /mac_rom ]; then module2 /mac_rom mac_rom; fi
        if [ -f /mac_disk ]; then module2 /mac_disk mac_disk; fi
    else
        if [ "$1" = 2 ]; then
            multiboot /boot/kernel-gfx1440.elf $2 $3
        elif [ "$1" = 1 ]; then
            multiboot /boot/kernel-gfx.elf $2 $3
        else
            multiboot /boot/kernel.elf $2 $3
        fi
        module /boot/initrd.tar initrd
        if [ -f /mac_rom ]; then module /mac_rom mac_rom; fi
        if [ -f /mac_disk ]; then module /mac_disk mac_disk; fi
    fi
}

menuentry "68k_HAL" {
    load_kernel 0
    boot
}

# No APIC and no MSI (the old 8259 interrupt controller, interrupts by lines), one CPU only, polling drivers.
menuentry "68k_HAL - safe mode (noapic nosmp)" {
    load_kernel 0 noapic nosmp
    boot
}

# cpuinfo, acpi, lspci, usb, irqs, disks, net and the boot messages, one page each (any key = next page).
menuentry "68k_HAL - hardware diagnostics" {
    load_kernel 0 diag
    boot
}

# The graphics console at the monitor's resolution (2560x1440 if there is such a mode); type "mac" at the
# prompt (needs mac_rom and mac_disk on the image).
menuentry "68k_HAL - Macintosh (graphics, then type: mac)" {
    load_kernel 2
    boot
}

# The USB driver left out: if the normal entry hangs or the keyboard does not work, this one still shows the
# diagnostic pages (they change by themselves) and tells whether the xHCI driver is the culprit.
menuentry "68k_HAL - diagnostics without the USB driver (noxhci)" {
    load_kernel 0 noxhci diag
    boot
}

if [ "$grub_platform" != efi ]; then
    menuentry "68k_HAL - graphics console (BIOS, 640x480)" {
        load_kernel 1
        boot
    }
fi

# UEFI only: 1920x1080, for a monitor without 2560x1440.
if [ "$grub_platform" = efi ]; then
    menuentry "68k_HAL - UEFI: 1920x1080" {
        set efi_kernel=kernel-gfx1080.elf
        load_kernel 0
        boot
    }
fi

# UEFI only: no resolution request. If the screen is garbled or empty with the entries above, try this one.
if [ "$grub_platform" = efi ]; then
    menuentry "68k_HAL - UEFI: keep the firmware's resolution" {
        set efi_kernel=kernel-gfx.elf
        load_kernel 0
        boot
    }
fi
