# Menu of the 68k_HAL disk (make mac-disk; docs/mac_disk.md). UEFI only. Lives on the Boot partition as
# /68k_hal/grub.cfg; the GRUB in EFI/BOOT/BOOTX64.EFI finds that partition and reads this file.
#
# grubenv (/68k_hal/grubenv, 1024 bytes) holds:
#   boot_slot    a or b: the kernel slot (/68k_hal/slot_a or slot_b)
#   system_slot  a or b: the Mac's System partition
#   trial        empty, or a slot to boot ONCE (a new kernel being tried, docs/mac_disk.md)
set default=0
set timeout=3
insmod efi_gop
insmod all_video

set boot_slot=a
set system_slot=a
if [ -f /68k_hal/grubenv ]; then load_env -f /68k_hal/grubenv boot_slot system_slot trial; fi

# A kernel being tried runs once: the variable is cleared before booting it, so a crash or a hang (the
# user resets the machine) falls back to the confirmed slot; if it cannot even be loaded, GRUB boots the
# fallback entry (the confirmed slot) at once. A trial kernel that starts writes boot_slot itself
# (kernel_confirm=1; docs/mac_disk.md section 8).
set kernel_slot=$boot_slot
set confirm=0
if [ -n "$trial" ]; then
    set kernel_slot=$trial
    set confirm=1
    set trial=
    save_env -f /68k_hal/grubenv trial
fi
set fallback=1

# The graphics kernel: its Multiboot2 header asks for 2560x1440 (the P520's monitor); GRUB keeps the
# firmware's mode if there is no such mode. kernel-gfx.elf asks for none (an entry below).
set efi_kernel=kernel-gfx1440.elf

# load_kernel <slot> <confirm 0|1> <more kernel command line words...>
function load_kernel {
    multiboot2 /68k_hal/slot_$1/$efi_kernel kernel_slot=$1 kernel_confirm=$2 system_slot=$system_slot $3 $4
    module2 /68k_hal/slot_$1/initrd.tar initrd
    module2 /68k_hal/mac_rom mac_rom
    if [ -f /68k_hal/68k_hal.cfg ]; then module2 /68k_hal/68k_hal.cfg config; fi
}

menuentry "68k_HAL (Mac)" {
    load_kernel $kernel_slot $confirm autostart=mac
    boot
}

# Entry 1 is the fallback: the confirmed kernel slot.
menuentry "68k_HAL (Mac) - the confirmed kernel slot" {
    load_kernel $boot_slot 0 autostart=mac
    boot
}

menuentry "68k_HAL - maintenance shell" {
    load_kernel $kernel_slot $confirm autostart=shell
    boot
}

menuentry "68k_HAL - hardware diagnostics" {
    load_kernel $kernel_slot $confirm autostart=shell diag
    boot
}

menuentry "68k_HAL (Mac) - keep the firmware's resolution" {
    set efi_kernel=kernel-gfx.elf
    load_kernel $kernel_slot $confirm autostart=mac
    boot
}

# Once, without making it the confirmed slot.
menuentry "68k_HAL (Mac) - the other kernel slot" {
    if [ "$boot_slot" = a ]; then set other=b; else set other=a; fi
    load_kernel $other 0 autostart=mac
    boot
}
