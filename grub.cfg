set default=0
set timeout=0

if [ "$grub_platform" = efi ]; then
    insmod all_video
    # UEFI has no VGA text mode: Multiboot2 gives the framebuffer, the ACPI
    # RSDP and the memory map. kernel-gfx.elf asks for a graphics mode.
    menuentry "68k_HAL (UEFI)" {
        multiboot2 /boot/kernel-gfx.elf
        module2 /boot/initrd.tar initrd
        boot
    }
else
    # Text mode.
    menuentry "68k_HAL" {
        multiboot /boot/kernel.elf
        module /boot/initrd.tar initrd
        boot
    }

    # Graphics mode: kernel-gfx.elf has a Multiboot header asking for a
    # 640x480x32 framebuffer. The console goes to serial only; the screen
    # shows a test pattern.
    menuentry "68k_HAL (graphics)" {
        multiboot /boot/kernel-gfx.elf
        module /boot/initrd.tar initrd
        boot
    }

    # Same text-mode kernel through Multiboot2.
    menuentry "68k_HAL (Multiboot2)" {
        multiboot2 /boot/kernel.elf
        module2 /boot/initrd.tar initrd
        boot
    }
fi
