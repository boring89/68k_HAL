set default=0
set timeout=0

# Text mode (the kernel asks for a graphics mode in its Multiboot header;
# gfxpayload=text keeps GRUB from setting it).
menuentry "68k_HAL" {
    set gfxpayload=text
    multiboot /boot/kernel.elf
    boot
}

# Graphics mode: the 640x480x32 framebuffer from the Multiboot header.
# The console goes to serial only; the screen shows a test pattern.
menuentry "68k_HAL (graphics)" {
    multiboot /boot/kernel.elf
    boot
}
