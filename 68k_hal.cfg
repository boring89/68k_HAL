# 68k_HAL settings (docs/mac_disk.md). On the 68k_HAL disk this file is /68k_hal/68k_hal.cfg on the Boot
# partition (FAT32): edit it there. One "key = value" per line; '#' starts a comment. The kernel command
# line (GRUB menu) can set the same keys and wins.

# What runs after boot: mac (the Macintosh) or shell. The GRUB menu entries set it.
#autostart = mac

# The Mac's screen: resolution (WxH or auto = as the last run ended / what fills the screen), colour depth,
# enlargement (auto, 1, 1.5, 2, ...), number of NuBus video cards (1 or 2), card or builtin video.
#mac_res = auto
#mac_depth = 8
#mac_scale = auto
#mac_cards = 1
#mac_video = card

# The Mac's memory in MB.
#mac_ram = 128

# Keep the Mac's parameter RAM (control panel settings) in /68k_hal/pram between starts: on or off.
#mac_pram = on

# Show the HAL's files (the shell's file tree) on the Mac's desktop as a read-only volume "HAL": on or off.
#mac_hal_volume = on

# The Mac's disk: auto (the System and Applications partitions of this disk) or a block device name
# (see the shell command disks) used whole.
#mac_disk = auto
